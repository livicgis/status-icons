<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Main radial gradient: dark red at edges, bright red in center-left -->
    <radialGradient id="sphereGrad" cx="38%" cy="35%" r="60%" fx="38%" fy="35%">
      <stop offset="0%"   stop-color="#ff6b6b"/>
      <stop offset="40%"  stop-color="#e02020"/>
      <stop offset="75%"  stop-color="#a00000"/>
      <stop offset="100%" stop-color="#5a0000"/>
    </radialGradient>

    <!-- Specular highlight gradient: white fade for gloss -->
    <radialGradient id="highlightGrad" cx="40%" cy="30%" r="40%" fx="40%" fy="28%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom reflection: subtle warm glow at base -->
    <radialGradient id="reflectGrad" cx="50%" cy="95%" r="40%" fx="50%" fy="95%">
      <stop offset="0%"   stop-color="#ff4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Main sphere body -->
  <circle cx="50" cy="50" r="44" fill="url(#sphereGrad)"/>

  <!-- Bottom warm reflection -->
  <circle cx="50" cy="50" r="44" fill="url(#reflectGrad)"/>

  <!-- Specular highlight -->
  <ellipse cx="38" cy="32" rx="16" ry="11" fill="url(#highlightGrad)" opacity="0.9"/>

  <!-- Rim darkening: thin dark outer ring for depth -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#3a0000" stroke-width="2.5" opacity="0.5"/>
</svg>
