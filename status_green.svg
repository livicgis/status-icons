<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sphereGrad" cx="38%" cy="35%" r="60%" fx="38%" fy="35%">
      <stop offset="0%"   stop-color="#7be87b"/>
      <stop offset="40%"  stop-color="#1a9a1a"/>
      <stop offset="75%"  stop-color="#0a6600"/>
      <stop offset="100%" stop-color="#033300"/>
    </radialGradient>
    <radialGradient id="highlightGrad" cx="40%" cy="30%" r="40%" fx="40%" fy="28%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="reflectGrad" cx="50%" cy="95%" r="40%" fx="50%" fy="95%">
      <stop offset="0%"   stop-color="#44ff44" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#44ff44" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Main sphere body -->
  <circle cx="50" cy="50" r="44" fill="url(#sphereGrad)"/>

  <!-- Bottom warm reflection -->
  <circle cx="50" cy="50" r="44" fill="url(#reflectGrad)"/>

  <!-- Specular highlight -->
  <ellipse cx="38" cy="32" rx="16" ry="11" fill="url(#highlightGrad)" opacity="0.9"/>

  <!-- Rim darkening -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#012200" stroke-width="2.5" opacity="0.5"/>
</svg>
